<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Design Ops</title>
<style>
  :root{--ink:#1f2328;--mut:#6b7280;--line:#e6e8ec;--bg:#f4f5f7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
  .card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 26px 24px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .brand{font-weight:800;letter-spacing:-.01em;color:#10132c;margin:0 0 4px;font-size:18px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 18px}
  label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
  input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;margin-bottom:12px}
  .btn{width:100%;background:#3F4AAF;color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .err{background:#fdecea;border:1px solid #f3c0b8;color:#c0392b;border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 14px}
</style>
</head>
<body>
<form class="card" method="post" action="/login" autocomplete="on">
  <p class="brand">Design Ops</p>
  <p class="sub">Sign in to continue.</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit">Sign in</button>
</form>
</body>
</html>
