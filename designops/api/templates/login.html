<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Design Ops</title>
<style>
  :root{--ink:#1B1B19;--mut:#8A8A82;--line:#E9E9E6;--bg:#FBFBFA;--accent:#5B5BD6;--accent-soft:#EEEEFB;--red:#A32B2B;--red-soft:#FBECEC}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
  .card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 26px 24px;box-shadow:0 1px 2px rgba(20,20,18,.04),0 4px 12px rgba(20,20,18,.05)}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,#5B5BD6,#8C7BEA 60%,#3FA79A);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
  .brand{font-weight:650;letter-spacing:-.01em;margin:0;font-size:16px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 18px}
  label{font-size:12px;color:#5C5C56;display:block;margin-bottom:5px;font-weight:560}
  input{width:100%;font:inherit;padding:8px 10px;border:1px solid #DEDEDA;border-radius:7px;background:#fff;margin-bottom:12px}
  input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:7px;padding:10px 14px;font-size:13px;font-weight:520;cursor:pointer}
  .btn:hover{background:#5151CB}
  .err{background:var(--red-soft);border:1px solid #E2C2C2;color:var(--red);border-radius:8px;padding:8px 10px;font-size:13px;margin:0 0 14px}
</style>
</head>
<body>
<form class="card" method="post" action="/login" autocomplete="on">
  <div class="brand-row"><div class="brand-mark">DO</div><p class="brand">Design Ops</p></div>
  <p class="sub">Sign in to continue.</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit">Sign in</button>
</form>
</body>
</html>
