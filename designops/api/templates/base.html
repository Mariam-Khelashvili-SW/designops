<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Design Ops{% endblock %}</title>
<style>
  :root{--ink:#1f2328;--mut:#6b7280;--line:#e6e8ec;--bg:#f4f5f7;--teal:#0f8a7e;--red:#c0392b;--warn:#b45309;--blue:#1d5fb0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header.top{background:#10132c;color:#fff;padding:0 20px;display:flex;align-items:center;gap:22px;height:52px}
  header.top .brand{font-weight:800;letter-spacing:-.01em}
  header.top nav{display:flex;gap:18px}
  header.top nav a{color:#c7cbe6;text-decoration:none;font-size:13px;padding:4px 0;border-bottom:2px solid transparent}
  header.top nav a.on,header.top nav a:hover{color:#fff;border-color:#12a594}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
  h1{font-size:20px;margin:0 0 3px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:7px 10px;border-bottom:1px solid var(--line)}
  td{padding:8px 10px;border-bottom:1px solid #f1f2f4;vertical-align:top}
  tr:last-child td{border-bottom:none}
  a{color:var(--blue)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .pill.ok{color:#0f8a7e;background:#e5f6f2}.pill.flagged{color:var(--warn);background:#fff5e8}
  .pill.failed{color:var(--red);background:#fdecea}.pill.mut{color:#5b6470;background:#eef0f3}
  .pill.running{color:#1d5fb0;background:#e8f0fb}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #cdd6f5;border-top-color:#3F4AAF;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:5px}
  .pill.red{color:var(--red);background:#fdecea}.pill.blue{color:var(--blue);background:#e8f0fb}
  .btn{display:inline-block;background:#3F4AAF;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.ghost{background:#fff;color:#3F4AAF;border:1px solid #ccd0ec}
  .btn:disabled,.btn[disabled]{background:#c5c8d6;color:#fff;border-color:#c5c8d6;cursor:not-allowed;opacity:.7;pointer-events:none}
  .btn.ghost:disabled,.btn.ghost[disabled]{background:#f3f4f7;color:#9aa0b4;border-color:#e1e3ea}
  .btn.busy{background:#eef0f3;color:#5b6470;border:1px solid #dde0e7;cursor:wait;pointer-events:none}
  input,select{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
  label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .banner{border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
  .banner.warn{background:#fff8ec;border:1px solid #f5c66b;color:#8a5a12}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  code{background:#f2f3f5;padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header class="top">
  <span class="brand">Design Ops</span>
  <nav>
    <a href="/daily-report" class="{{ 'on' if nav=='daily' }}">Daily report</a>
    <a href="/weekly-backlog" class="{{ 'on' if nav=='weekly' }}">Weekly backlog</a>
    <a href="/weekly-health" class="{{ 'on' if nav=='weekly_health' }}">Weekly health</a>
    <a href="/call-summary" class="{{ 'on' if nav=='call_summary' }}">Call summary</a>
    <a href="/runs" class="{{ 'on' if nav=='runs' }}">Run log</a>
    <a href="/pipelines" class="{{ 'on' if nav=='pipelines' }}">Pipelines</a>
    <a href="/accounts" class="{{ 'on' if nav=='accounts' }}">Accounts</a>
    <a href="/config" class="{{ 'on' if nav=='config' }}">Config</a>
  </nav>
</header>
<div class="wrap">
{% block body %}{% endblock %}
</div>
</body>
</html>
